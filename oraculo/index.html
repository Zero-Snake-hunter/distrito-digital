<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>El Oráculo — Pokétarot</title>
<meta name="robots" content="noindex,nofollow"/>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Raleway:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"/>

<style>
/* ── Reset & tokens ─────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bk:#0a0a0f;
  --bk2:#120a1c;
  --gold:#d4af37;
  --gold-dim:#8a7128;
  --purple:#6b21a8;
  --purple-dim:#3a1260;
  --wh:#f2ece0;
  --mu:#948f9e;
  --fh:'Cinzel',serif;
  --fb:'Raleway',sans-serif;
}
html{height:100%}
body{
  height:100%;
  background:var(--bk);
  color:var(--wh);
  font-family:var(--fb);
  font-weight:300;
  overflow:hidden;
  visibility:hidden; /* se revela solo si el token es correcto */
}
img{display:block;max-width:100%}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}
::selection{background:var(--purple);color:var(--wh)}

/* ── Fondo esotérico, CSS puro ──────────────────── */
.mystic-bg{
  position:fixed;
  inset:0;
  z-index:0;
  background-color:var(--bk);
  background-image:
    radial-gradient(circle at 18% 25%, rgba(107,33,168,.30), transparent 42%),
    radial-gradient(circle at 82% 78%, rgba(212,175,55,.14), transparent 46%),
    radial-gradient(circle at 50% 100%, rgba(107,33,168,.18), transparent 55%),
    repeating-linear-gradient(45deg, rgba(212,175,55,.035) 0 1px, transparent 1px 64px),
    repeating-linear-gradient(-45deg, rgba(107,33,168,.045) 0 1px, transparent 1px 64px),
    radial-gradient(1.5px 1.5px at 12% 18%, #fff8, transparent),
    radial-gradient(1.5px 1.5px at 76% 12%, #fff6, transparent),
    radial-gradient(1px 1px at 34% 62%, #fff7, transparent),
    radial-gradient(1.5px 1.5px at 58% 84%, #fff5, transparent),
    radial-gradient(1px 1px at 91% 40%, #fff6, transparent),
    radial-gradient(1.5px 1.5px at 6% 70%, #fff5, transparent),
    radial-gradient(1px 1px at 46% 8%, #fff6, transparent),
    radial-gradient(1.5px 1.5px at 68% 48%, #fff5, transparent);
}

/* ── App shell ───────────────────────────────────── */
#app{position:relative;z-index:1;height:100vh;width:100vw}

/* ── Pantalla inicial (gate de tiradas) ─────────── */
#gate-screen{
  height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2.4rem;
  padding:2rem 1.5rem;
  text-align:center;
}
#gate-screen[hidden]{display:none}
.gate-title{
  font-family:var(--fh);
  font-weight:900;
  letter-spacing:.28em;
  font-size:clamp(2.2rem,6vw,4.2rem);
  color:var(--gold);
  text-shadow:0 0 24px rgba(212,175,55,.45),0 0 2px rgba(212,175,55,.8);
}
.gate-sub{
  font-family:var(--fb);
  font-weight:300;
  font-style:italic;
  color:var(--mu);
  letter-spacing:.04em;
  margin-top:-1.4rem;
}
.spread-choices{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:1rem;
  max-width:760px;
}
.spread-btn{
  background:linear-gradient(160deg,rgba(107,33,168,.28),rgba(10,10,15,.6));
  border:1px solid var(--gold-dim);
  color:var(--wh);
  padding:1rem 1.4rem;
  border-radius:10px;
  font-family:var(--fh);
  font-size:.95rem;
  letter-spacing:.05em;
  min-width:160px;
  transition:border-color .2s, transform .2s, box-shadow .2s;
}
.spread-btn:hover,.spread-btn:focus-visible{
  border-color:var(--gold);
  transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(212,175,55,.18);
}
.spread-btn.selected{
  border-color:var(--gold);
  background:linear-gradient(160deg,rgba(212,175,55,.22),rgba(107,33,168,.22));
  box-shadow:0 0 0 1px var(--gold) inset;
}
.spread-btn small{display:block;color:var(--mu);font-family:var(--fb);font-weight:300;font-size:.72rem;margin-top:.35rem}

.question-row{display:flex;flex-direction:column;gap:.6rem;width:min(480px,86vw)}
#question-input{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(212,175,55,.3);
  border-radius:8px;
  padding:.75rem 1rem;
  color:var(--wh);
  font-size:.95rem;
}
#question-input::placeholder{color:var(--mu)}
#question-input:focus{outline:none;border-color:var(--gold)}

#shuffle-btn{
  background:linear-gradient(135deg,var(--gold),#a9842a);
  color:#1a1206;
  border:none;
  padding:1rem 3rem;
  border-radius:999px;
  font-family:var(--fh);
  font-weight:700;
  letter-spacing:.1em;
  font-size:1rem;
  box-shadow:0 10px 30px rgba(212,175,55,.25);
  transition:transform .2s, box-shadow .2s, opacity .2s;
}
#shuffle-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 36px rgba(212,175,55,.35)}
#shuffle-btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}

/* ── Pantalla de lectura ─────────────────────────── */
#reading-screen{height:100%;display:flex}
#reading-screen[hidden]{display:none}

#cards-area{
  width:60%;
  height:100%;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:2rem;
}

#panel{
  width:40%;
  height:100%;
  border-left:1px solid rgba(212,175,55,.22);
  background:rgba(5,4,10,.55);
  display:flex;
  flex-direction:column;
}
#panel-content{
  flex:1;
  overflow-y:auto;
  padding:2.4rem 2.2rem 1rem;
  scroll-behavior:smooth;
}
#panel-content::-webkit-scrollbar{width:8px}
#panel-content::-webkit-scrollbar-thumb{background:rgba(212,175,55,.3);border-radius:4px}
#panel-hint{
  padding:1rem 2.2rem 1.4rem;
  text-align:center;
  color:var(--mu);
  font-size:.82rem;
  letter-spacing:.03em;
  border-top:1px solid rgba(212,175,55,.12);
}
#panel-hint kbd{
  background:rgba(212,175,55,.14);
  border:1px solid rgba(212,175,55,.4);
  border-radius:4px;
  padding:.05rem .4rem;
  font-family:var(--fb);
  color:var(--gold);
}
#panel-hint[hidden]{display:none}

.section-block{margin-bottom:2rem}
.section-block .section-label{
  font-family:var(--fh);
  color:var(--gold);
  font-size:.82rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  margin-bottom:.5rem;
  display:flex;
  align-items:center;
  gap:.5rem;
}
.section-block .section-label .num-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:1.5rem;height:1.5rem;
  border-radius:50%;
  border:1px solid var(--gold);
  font-size:.7rem;
}
.section-block .section-body{
  font-family:var(--fb);
  font-weight:300;
  line-height:1.75;
  font-size:1rem;
  color:var(--wh);
  white-space:pre-wrap;
}
.section-block .section-body .cursor{
  display:inline-block;
  width:.5em;
  color:var(--gold);
  animation:blink 1s step-end infinite;
}
@keyframes blink{50%{opacity:0}}
.section-block.cierre .section-label{color:var(--purple);filter:brightness(1.6)}
.panel-empty{color:var(--mu);font-style:italic;font-size:.9rem;text-align:center;margin-top:3rem}
.panel-error{color:#e07a7a;font-size:.9rem;text-align:center;margin-top:2rem}

#restart-btn{
  margin:0 2.2rem 1.6rem;
  background:transparent;
  border:1px solid var(--gold-dim);
  color:var(--gold);
  padding:.65rem 1.2rem;
  border-radius:999px;
  font-family:var(--fh);
  font-size:.82rem;
  letter-spacing:.08em;
  align-self:center;
  transition:border-color .2s;
}
#restart-btn:hover{border-color:var(--gold)}
#restart-btn[hidden]{display:none}

/* ── Capa de barajado ─────────────────────────────── */
#shuffle-layer{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}
#shuffle-layer[hidden]{display:none}
.shuffle-card{
  position:absolute;
  width:120px;height:200px;
  border-radius:10px;
  border:2px solid var(--gold);
  background:linear-gradient(135deg,#140a22,#06040a);
  box-shadow:0 10px 30px rgba(0,0,0,.6);
  animation:shuffleMove 1.1s ease-in-out infinite alternate;
}
.shuffle-card::after{
  content:'✦';
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--gold);font-size:1.6rem;
  text-shadow:0 0 10px rgba(212,175,55,.7);
}
.shuffle-card:nth-child(1){animation-delay:0s;transform:translateX(-90px) rotate(-12deg)}
.shuffle-card:nth-child(2){animation-delay:.08s;transform:translateX(-45px) rotate(-6deg)}
.shuffle-card:nth-child(3){animation-delay:.16s;transform:translateX(0) rotate(0deg)}
.shuffle-card:nth-child(4){animation-delay:.24s;transform:translateX(45px) rotate(6deg)}
.shuffle-card:nth-child(5){animation-delay:.32s;transform:translateX(90px) rotate(12deg)}
.shuffle-card:nth-child(6){animation-delay:.4s;transform:translateX(0) rotate(0deg) translateY(-40px)}
@keyframes shuffleMove{
  0%{transform:translate(var(--sx,0),0) rotate(var(--sr,0deg)) scale(1)}
  50%{transform:translate(calc(var(--sx,0) * -1),-24px) rotate(calc(var(--sr,0deg) * -1)) scale(1.03)}
  100%{transform:translate(var(--sx,0),6px) rotate(var(--sr,0deg)) scale(.98)}
}
#shuffle-layer.fading{opacity:0;transition:opacity .4s ease}

/* ── Layout de cartas ──────────────────────────────── */
#spread-layout{
  position:relative;
  opacity:0;
  transform:scale(.96);
  transition:opacity .5s ease, transform .5s ease;
}
#spread-layout.visible{opacity:1;transform:scale(1)}

#spread-layout.layout-una_carta{display:flex;align-items:center;justify-content:center}
#spread-layout.layout-tres_cartas{display:flex;align-items:center;justify-content:center;gap:2.2rem}
#spread-layout.layout-seis_cartas{display:grid;grid-template-columns:repeat(2,1fr);gap:2rem 2.6rem}
#spread-layout.layout-cruz_celta{
  width:min(58vw,820px);
  aspect-ratio:2600/1600;
}

.card-slot{position:relative}
.layout-una_carta .card-slot{width:230px;height:390px}
.layout-tres_cartas .card-slot{width:175px;height:296px}
.layout-seis_cartas .card-slot{width:150px;height:254px}
.layout-cruz_celta .card-slot{
  /* Tamaño relativo al contenedor (no px fijos): mismas proporciones que
     el layout del bot de Telegram (cartas 250x420 sobre canvas 2600x1600 =
     9.615% de ancho). Con % fijo el card no escala con el contenedor y se
     solapa de más o de menos según el viewport. */
  position:absolute;
  width:9.62%;
  aspect-ratio:250/420;
  left:calc(var(--x) * 1%);
  top:calc(var(--y) * 1%);
  transform:translate(-50%,-50%) rotate(var(--rot,0deg));
}

.pos-badge{
  position:absolute;
  top:-14px;left:-14px;
  width:28px;height:28px;
  border-radius:50%;
  background:rgba(10,8,20,.85);
  border:1px solid var(--gold);
  color:var(--gold);
  font-family:var(--fh);
  font-size:.75rem;
  display:flex;align-items:center;justify-content:center;
  z-index:3;
  pointer-events:none;
}
.layout-cruz_celta .pos-badge{width:20px;height:20px;font-size:.62rem;top:-8px;left:-8px}

.card-perspective{width:100%;height:100%;perspective:1200px}
.card-flip{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;
  transition:transform .7s cubic-bezier(.4,.1,.2,1);
  cursor:pointer;
}
.card-slot.flipped .card-flip{transform:rotateY(180deg)}
.card-slot.disabled .card-flip{cursor:default}

.card-face{
  position:absolute;inset:0;
  backface-visibility:hidden;
  border-radius:9px;
  border:2px solid var(--gold);
  overflow:hidden;
  box-shadow:0 10px 26px rgba(0,0,0,.55);
}
.card-back{
  background:linear-gradient(135deg,#140a22,#06040a);
  display:flex;align-items:center;justify-content:center;
}
.card-back .sigil{color:var(--gold);font-size:1.9rem;text-shadow:0 0 10px rgba(212,175,55,.6)}
.layout-cruz_celta .card-back .sigil{font-size:1.1rem}

.card-front{
  transform:rotateY(180deg);
  display:flex;flex-direction:column;
}
.card-art{
  flex:1;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.4rem;
  padding:.6rem;
  text-align:center;
}
.card-art.reversed{transform:rotate(180deg)}
.card-art .arcana-name{
  font-family:var(--fh);
  font-weight:600;
  font-size:.82rem;
  line-height:1.25;
  color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.6);
}
.card-art .pokemon-name{
  font-family:var(--fb);
  font-size:.68rem;
  font-style:italic;
  color:rgba(255,255,255,.78);
}
.layout-cruz_celta .card-art .arcana-name{font-size:.56rem}
.layout-cruz_celta .card-art .pokemon-name{font-size:.48rem}
.layout-seis_cartas .card-art .arcana-name,
.layout-tres_cartas .card-art .arcana-name{font-size:.72rem}

.reversed-tag{
  position:absolute;bottom:4px;right:4px;
  background:rgba(0,0,0,.55);
  color:var(--gold);
  font-size:.55rem;
  padding:.1rem .35rem;
  border-radius:4px;
  letter-spacing:.05em;
}

@media (max-width:760px){
  #reading-screen{flex-direction:column}
  #cards-area,#panel{width:100%}
  #cards-area{height:56%;padding:1rem}
  #panel{height:44%;border-left:none;border-top:1px solid rgba(212,175,55,.22)}
  .layout-cruz_celta{width:min(94vw,520px)!important}
}
</style>
</head>
<body>

<div class="mystic-bg" aria-hidden="true"></div>

<div id="app">

  <!-- ── Pantalla inicial ──────────────────────────── -->
  <section id="gate-screen">
    <h1 class="gate-title">POKÉTAROT</h1>
    <p class="gate-sub">El oráculo escucha. Elige tu tirada.</p>

    <div class="spread-choices" id="spread-choices">
      <button class="spread-btn" data-spread="una_carta" type="button">
        Una Carta
        <small>Mensaje del momento</small>
      </button>
      <button class="spread-btn" data-spread="tres_cartas" type="button">
        Tres Cartas
        <small>Pasado · Presente · Futuro</small>
      </button>
      <button class="spread-btn" data-spread="seis_cartas" type="button">
        El Oráculo
        <small>Seis cartas</small>
      </button>
      <button class="spread-btn" data-spread="cruz_celta" type="button">
        Cruz Celta
        <small>Diez cartas</small>
      </button>
    </div>

    <div class="question-row">
      <input id="question-input" type="text" maxlength="200" placeholder="¿Tienes una pregunta para el oráculo? (opcional)"/>
    </div>

    <button id="shuffle-btn" type="button" disabled>Barajar</button>
  </section>

  <!-- ── Pantalla de lectura ───────────────────────── -->
  <section id="reading-screen" hidden>
    <div id="cards-area">
      <div id="shuffle-layer" hidden>
        <div class="shuffle-card"></div>
        <div class="shuffle-card"></div>
        <div class="shuffle-card"></div>
        <div class="shuffle-card"></div>
        <div class="shuffle-card"></div>
        <div class="shuffle-card"></div>
      </div>
      <div id="spread-layout"></div>
    </div>
    <aside id="panel">
      <div id="panel-content">
        <p class="panel-empty">El oráculo se prepara…</p>
      </div>
      <button id="restart-btn" type="button" hidden>✦ Nueva tirada</button>
      <div id="panel-hint" hidden>Presiona <kbd>ESPACIO</kbd> o haz click en una carta para revelarla</div>
    </aside>
  </section>

</div>

<script>
(function(){
"use strict";

// ============================================================
// GATE DE ACCESO — token simple por URL (?token=pokemontarot2026)
// No es seguridad real: solo evita que alguien tropiece con el enlace
// mientras no hay autenticación propiamente dicha.
// ============================================================
function checkAccessToken(){
  var params = new URLSearchParams(window.location.search);
  return params.get("token") === "pokemontarot2026";
}

if (!checkAccessToken()) {
  document.body.innerHTML = "";
  return;
}
document.body.style.visibility = "visible";

// ============================================================
// CONFIGURACIÓN
// ============================================================

// ⚠️ Reemplazar por la URL real del Worker tras el deploy
// (wrangler deploy imprime el subdominio *.workers.dev, o usa tu dominio
// propio si le pusiste una ruta custom en Cloudflare).
var WORKER_URL = "https://poketarot-worker.TU-SUBDOMINIO.workers.dev/tirada";

// Mismas posiciones que data/cards.py / worker — se usan para pintar las
// etiquetas de posición ANTES de que llegue el evento SSE "cards", para
// que el layout no tenga que esperar a la red.
var SPREAD_POSITIONS = {
  una_carta: [
    { pos: 1, name: "La Carta" }
  ],
  tres_cartas: [
    { pos: 1, name: "Pasado" },
    { pos: 2, name: "Presente" },
    { pos: 3, name: "Futuro" }
  ],
  seis_cartas: [
    { pos: 1, name: "Tu energía actual" },
    { pos: 2, name: "La energía externa" },
    { pos: 3, name: "La raíz" },
    { pos: 4, name: "El bloqueo oculto" },
    { pos: 5, name: "El futuro cercano" },
    { pos: 6, name: "El consejo final" }
  ],
  cruz_celta: [
    { pos: 1, name: "La Situación" },
    { pos: 2, name: "El Cruce" },
    { pos: 3, name: "La Raíz" },
    { pos: 4, name: "El Pasado Reciente" },
    { pos: 5, name: "La Corona" },
    { pos: 6, name: "El Futuro Próximo" },
    { pos: 7, name: "El Consultante" },
    { pos: 8, name: "Influencias Externas" },
    { pos: 9, name: "Esperanzas y Miedos" },
    { pos: 10, name: "El Resultado" }
  ]
};

// Posiciones porcentuales dentro del layout absoluto de la Cruz Celta
// (mismas proporciones que services/spread_image.py del bot, canvas
// 2600x1600, normalizadas a %).
var CRUZ_CELTA_POS = {
  1: { x: 38.46, y: 54.69, rotate: 0 },
  2: { x: 52.31, y: 43.44, rotate: 90 },
  3: { x: 38.46, y: 83.75, rotate: 0 },
  4: { x: 9.62, y: 54.69, rotate: 0 },
  5: { x: 38.46, y: 25.63, rotate: 0 },
  6: { x: 67.31, y: 54.69, rotate: 0 },
  7: { x: 93.46, y: 71.88, rotate: 0 },
  8: { x: 80.77, y: 71.88, rotate: 0 },
  9: { x: 93.46, y: 17.5, rotate: 0 },
  10: { x: 80.77, y: 17.5, rotate: 0 }
};

var SUIT_COLORS = {
  "Arcanos Mayores": "linear-gradient(150deg,#3a1260,#1a0a30)",
  "Bastos": "linear-gradient(150deg,#7a2f12,#2c0f06)",
  "Copas": "linear-gradient(150deg,#123a5a,#061a2c)",
  "Espadas": "linear-gradient(150deg,#2e3240,#101218)",
  "Oros": "linear-gradient(150deg,#6b4f12,#241a04)"
};

var TYPE_SPEED_MS = 16; // ms entre ticks del efecto typewriter

// ============================================================
// ESTADO
// ============================================================
var els = {
  gateScreen: document.getElementById("gate-screen"),
  readingScreen: document.getElementById("reading-screen"),
  spreadChoices: document.getElementById("spread-choices"),
  questionInput: document.getElementById("question-input"),
  shuffleBtn: document.getElementById("shuffle-btn"),
  cardsArea: document.getElementById("cards-area"),
  shuffleLayer: document.getElementById("shuffle-layer"),
  spreadLayout: document.getElementById("spread-layout"),
  panelContent: document.getElementById("panel-content"),
  panelHint: document.getElementById("panel-hint"),
  restartBtn: document.getElementById("restart-btn")
};

var selectedSpread = null;
var state = null; // se reinicializa en cada tirada

function freshState(spreadType) {
  return {
    spreadType: spreadType,
    positions: SPREAD_POSITIONS[spreadType],
    total: SPREAD_POSITIONS[spreadType].length,
    cardsData: null,        // llega por el evento SSE "cards"
    sections: {},           // tag -> { text, done }
    revealed: {},           // tag -> true una vez que empezó a mostrarse
    revealQueue: [],
    typing: false,
    flippedCount: 0,
    cierreTriggered: false,
    streamEnded: false,
    streamError: null
  };
}

// ============================================================
// SELECCIÓN DE TIRADA
// ============================================================
els.spreadChoices.addEventListener("click", function (e) {
  var btn = e.target.closest(".spread-btn");
  if (!btn) return;
  selectedSpread = btn.getAttribute("data-spread");
  Array.prototype.forEach.call(els.spreadChoices.children, function (b) {
    b.classList.toggle("selected", b === btn);
  });
  els.shuffleBtn.disabled = false;
});

els.shuffleBtn.addEventListener("click", function () {
  if (!selectedSpread) return;
  startReading(selectedSpread, els.questionInput.value.trim());
});

els.restartBtn.addEventListener("click", resetToGate);

function resetToGate() {
  els.readingScreen.hidden = true;
  els.gateScreen.hidden = false;
  els.spreadLayout.innerHTML = "";
  els.spreadLayout.className = "";
  els.panelContent.innerHTML = '<p class="panel-empty">El oráculo se prepara…</p>';
  els.panelHint.hidden = true;
  els.restartBtn.hidden = true;
  state = null;
  document.removeEventListener("keydown", onKeydown);
}

// ============================================================
// FLUJO PRINCIPAL DE UNA TIRADA
// ============================================================
function startReading(spreadType, question) {
  state = freshState(spreadType);

  els.gateScreen.hidden = true;
  els.readingScreen.hidden = false;
  els.panelContent.innerHTML = "";
  els.panelHint.hidden = false;
  els.restartBtn.hidden = true;

  buildFaceDownLayout(spreadType);
  runShuffleAnimation();

  document.addEventListener("keydown", onKeydown);

  connectToOracle(spreadType, question);
}

// ── Animación de barajado ────────────────────────
function runShuffleAnimation() {
  els.shuffleLayer.hidden = false;
  els.shuffleLayer.classList.remove("fading");
  els.spreadLayout.classList.remove("visible");

  setTimeout(function () {
    els.shuffleLayer.classList.add("fading");
    setTimeout(function () {
      els.shuffleLayer.hidden = true;
      els.spreadLayout.classList.add("visible");
    }, 400);
  }, 2400);
}

// ── Construcción del layout boca abajo ───────────
function buildFaceDownLayout(spreadType) {
  var layout = els.spreadLayout;
  layout.innerHTML = "";
  layout.className = "layout-" + spreadType;

  state.positions.forEach(function (pos) {
    var slot = document.createElement("div");
    slot.className = "card-slot disabled";
    slot.dataset.pos = pos.pos;

    if (spreadType === "cruz_celta") {
      var cp = CRUZ_CELTA_POS[pos.pos];
      slot.style.setProperty("--x", cp.x);
      slot.style.setProperty("--y", cp.y);
      slot.style.setProperty("--rot", cp.rotate + "deg");
    }

    var badge = document.createElement("div");
    badge.className = "pos-badge";
    badge.textContent = pos.pos;
    slot.appendChild(badge);

    var perspective = document.createElement("div");
    perspective.className = "card-perspective";

    var flip = document.createElement("div");
    flip.className = "card-flip";

    var back = document.createElement("div");
    back.className = "card-face card-back";
    back.innerHTML = '<span class="sigil">✦</span>';

    var front = document.createElement("div");
    front.className = "card-face card-front";
    front.innerHTML = '<div class="card-art"><span class="arcana-name">…</span></div>';

    flip.appendChild(back);
    flip.appendChild(front);
    perspective.appendChild(flip);
    slot.appendChild(perspective);

    slot.addEventListener("click", function () {
      flipCard(pos.pos);
    });

    layout.appendChild(slot);
  });
}

// ── Aplica los datos reales de las cartas (evento "cards") ──
function applyCardsData(data) {
  state.cardsData = {};
  data.cards.forEach(function (entry) {
    state.cardsData[entry.pos] = entry;
  });

  data.cards.forEach(function (entry) {
    var slot = els.spreadLayout.querySelector('.card-slot[data-pos="' + entry.pos + '"]');
    if (!slot) return;
    slot.classList.remove("disabled");

    var front = slot.querySelector(".card-front");
    var suitGradient = SUIT_COLORS[entry.card.suit] || SUIT_COLORS["Arcanos Mayores"];
    front.style.background = suitGradient;

    var artClass = "card-art" + (entry.reversed ? " reversed" : "");
    front.innerHTML =
      '<div class="' + artClass + '">' +
        '<span class="arcana-name">' + escapeHtml(entry.card.card_name) + "</span>" +
        '<span class="pokemon-name">' + escapeHtml(entry.card.pokemon) + "</span>" +
      "</div>" +
      (entry.reversed ? '<span class="reversed-tag">INVERTIDA</span>' : "");
  });
}

// ── Flip de una carta específica (click o espacio) ──
function flipCard(pos) {
  if (!state || !state.cardsData) return;
  var slot = els.spreadLayout.querySelector('.card-slot[data-pos="' + pos + '"]');
  if (!slot || slot.classList.contains("flipped")) return;

  slot.classList.add("flipped");
  state.flippedCount++;

  revealSection("CARTA_" + pos, positionLabelFor(pos));

  if (state.flippedCount >= state.total && !state.cierreTriggered) {
    state.cierreTriggered = true;
    revealSection("CIERRE", { label: "El oráculo concluye", num: null });
  }
}

function positionLabelFor(pos) {
  var p = state.positions.find(function (x) { return x.pos === Number(pos); });
  return { label: p ? p.name : ("Posición " + pos), num: pos };
}

function nextUnflippedPos() {
  for (var i = 0; i < state.positions.length; i++) {
    var pos = state.positions[i].pos;
    var slot = els.spreadLayout.querySelector('.card-slot[data-pos="' + pos + '"]');
    if (slot && !slot.classList.contains("flipped")) return pos;
  }
  return null;
}

function onKeydown(e) {
  if (e.code !== "Space") return;
  var tag = (document.activeElement && document.activeElement.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  e.preventDefault();
  if (!state) return;
  var pos = nextUnflippedPos();
  if (pos !== null) flipCard(pos);
}

// ============================================================
// CLIENTE SSE (fetch + ReadableStream, no EventSource porque
// necesitamos POST con body)
// ============================================================
function connectToOracle(spreadType, question) {
  var body = { spread_type: spreadType };
  if (question) body.question = question;

  fetch(WORKER_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  })
    .then(function (resp) {
      if (!resp.ok || !resp.body) {
        throw new Error("El oráculo respondió " + resp.status);
      }
      return pumpSseStream(resp.body, handleSseEvent);
    })
    .then(function () {
      if (state) state.streamEnded = true;
    })
    .catch(function (err) {
      if (!state) return;
      state.streamError = err;
      showStreamError(err);
    });
}

function pumpSseStream(body, onEvent) {
  var reader = body.getReader();
  var decoder = new TextDecoder();
  var buffer = "";

  function step() {
    return reader.read().then(function (res) {
      if (res.done) return;
      buffer += decoder.decode(res.value, { stream: true });

      var sepIdx;
      while ((sepIdx = buffer.indexOf("\n\n")) !== -1) {
        var raw = buffer.slice(0, sepIdx);
        buffer = buffer.slice(sepIdx + 2);
        var eventName = "message";
        var dataLines = [];
        raw.split("\n").forEach(function (line) {
          if (line.indexOf("event:") === 0) {
            eventName = line.slice(6).trim();
          } else if (line.indexOf("data:") === 0) {
            dataLines.push(line.slice(5).replace(/^\s/, ""));
          }
        });
        if (dataLines.length) {
          var raw2 = dataLines.join("\n");
          var parsed;
          try { parsed = JSON.parse(raw2); } catch (e) { parsed = raw2; }
          onEvent(eventName, parsed);
        }
      }
      return step();
    });
  }

  return step();
}

function handleSseEvent(eventName, data) {
  if (!state) return;
  if (eventName === "cards") {
    applyCardsData(data);
    return;
  }
  if (eventName === "done") {
    onOracleDone(data);
    return;
  }
  if (eventName === "error") {
    showStreamError(new Error(data && data.message ? data.message : "Error desconocido del oráculo"));
    return;
  }
  if (eventName.indexOf("text_") === 0) {
    handleTextChunk(data);
  }
}

function handleTextChunk(data) {
  var tag = data && data.tag;
  if (!tag) return;
  var section = state.sections[tag] || (state.sections[tag] = { text: "", done: false });
  if (data.text) section.text += data.text;
  if (data.done) section.done = true;

  if (tag === "INTRO" && !state.revealed.INTRO) {
    revealSection("INTRO", { label: "El oráculo habla", num: null });
  }
  // CARTA_N y CIERRE se revelan por interacción del usuario (flipCard / fin
  // de la tirada), no automáticamente al llegar el texto.
}

function onOracleDone(data) {
  if (data && data.ok === false) {
    showStreamError(new Error("El oráculo no pudo completar la lectura."));
  }
}

function showStreamError(err) {
  console.error("[ORACULO]", err);
  var box = document.createElement("div");
  box.className = "panel-error";
  box.textContent = "⚠ El oráculo no pudo completar la conexión. Intenta de nuevo.";
  els.panelContent.appendChild(box);
  els.restartBtn.hidden = false;
}

// ============================================================
// REVELADO DE SECCIONES + EFECTO TYPEWRITER
// ============================================================
function revealSection(tag, meta) {
  if (state.revealed[tag]) return;
  state.revealed[tag] = true;
  state.revealQueue.push({ tag: tag, meta: meta });
  pumpRevealQueue();
}

function pumpRevealQueue() {
  if (state.typing) return;
  var next = state.revealQueue.shift();
  if (!next) return;
  state.typing = true;
  typeSection(next.tag, next.meta, function () {
    state.typing = false;
    pumpRevealQueue();
  });
}

function typeSection(tag, meta, onComplete) {
  var block = document.createElement("div");
  block.className = "section-block" + (tag === "CIERRE" ? " cierre" : "");

  var label = document.createElement("div");
  label.className = "section-label";
  if (meta && meta.num) {
    var badge = document.createElement("span");
    badge.className = "num-badge";
    badge.textContent = meta.num;
    label.appendChild(badge);
  }
  var labelText = document.createElement("span");
  labelText.textContent = meta ? meta.label : tag;
  label.appendChild(labelText);
  block.appendChild(label);

  var body = document.createElement("div");
  body.className = "section-body";
  var textSpan = document.createElement("span");
  var cursor = document.createElement("span");
  cursor.className = "cursor";
  cursor.textContent = "▌";
  body.appendChild(textSpan);
  body.appendChild(cursor);
  block.appendChild(body);

  var emptyMsg = els.panelContent.querySelector(".panel-empty");
  if (emptyMsg) emptyMsg.remove();
  els.panelContent.appendChild(block);
  scrollPanelToBottom();

  var shown = 0;
  function tick() {
    var section = state.sections[tag];
    var fullText = section ? section.text : "";
    var done = section ? section.done : false;

    if (shown < fullText.length) {
      // revela 1-2 caracteres por tick para un ritmo de tecleo natural
      var step = Math.min(fullText.length - shown, 1 + (Math.random() < 0.3 ? 1 : 0));
      shown += step;
      textSpan.textContent = fullText.slice(0, shown);
      scrollPanelToBottom();
      setTimeout(tick, TYPE_SPEED_MS);
      return;
    }

    if (done || state.streamEnded || state.streamError) {
      cursor.remove();
      if (tag === "CIERRE") {
        els.restartBtn.hidden = false;
        els.panelHint.hidden = true;
      }
      onComplete();
      return;
    }

    // el texto ya mostrado agotó el buffer, pero la sección sigue
    // generándose en el servidor — seguimos esperando sin bloquear la UI
    setTimeout(tick, 80);
  }
  tick();
}

function scrollPanelToBottom() {
  els.panelContent.scrollTop = els.panelContent.scrollHeight;
}

function escapeHtml(str) {
  var div = document.createElement("div");
  div.textContent = str == null ? "" : String(str);
  return div.innerHTML;
}

})();
</script>
</body>
</html>
